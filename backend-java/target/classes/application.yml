server:
  port: ${PORT:5000}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: temple-drop-backend
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false
  web:
    resources:
      static-locations: file:../client/dist/,classpath:/static/

app:
  env: ${NODE_ENV:development}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  cookie-secure: ${COOKIE_SECURE:false}
  csrf-secret: ${CSRF_SECRET}
  session-secret: ${SESSION_SECRET}
  serve-static: ${SERVE_CLIENT_DIST:true}
  admin-username: ${ADMIN_USERNAME}
  admin-password: ${ADMIN_PASSWORD}
  operations-api-url: ${OPERATIONS_API_URL:${PROVIDER_API_URL:}}
  internal-service-key: ${INTERNAL_SERVICE_KEY:${GAME_SERVER_API_KEY:}}
